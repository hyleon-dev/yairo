name: Pre-release

# Triggered by pushing a tag like "v1.2.3-pre1": builds the Windows NSIS
# installer and attaches it to a new GitHub pre-release. Mirrors release.yml
# step for step, the only differences are the tag pattern and marking the
# GitHub release as a pre-release. release.yml deletes these again (release
# + tag) once the matching real release ships, see its "Delete old
# pre-releases" step.
on:
  push:
    tags:
      - 'v*-pre*'

permissions:
  contents: write

jobs:
  prerelease:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # A shallow fetch (the default) makes actions/checkout resolve tags
          # as lightweight refs, dropping the annotated tag's own message
          # object (see https://github.com/actions/checkout/issues/290) -
          # needed in full here so the title-extraction step below actually
          # sees "tag", not "commit".
          fetch-depth: 0

      # fetch-depth: 0 alone isn't enough: actions/checkout still creates the
      # local refs/tags/<name> ref pointing directly at the tag's peeled
      # commit SHA (not the annotated tag object).
      # A real "fetch --tags" re-resolves the ref to the actual tag object -
      # --force is required to overwrite  the (wrong) local ref that checkout
      # already created.
      - name: Re-fetch tags as real tag objects
        run: git fetch --tags --force origin

      # Uses "[<tag>] <annotated tag message>" as the release title, if there
      # is a message (git tag -a v1.2.0-pre1 -m "My Title") - falls back to
      # just the tag name for plain/lightweight tags (no redundant
      # "[v1.2.0-pre1] v1.2.0-pre1").
      # Important: a lightweight tag ref points directly at the commit, so
      # "%(contents)" on it would return that COMMIT's message, not "nothing"
      # - cat-file -t distinguishes an actual tag object ("tag") from a
      # lightweight tag ("commit") first.
      - name: Extract release title from tag message
        id: tag
        shell: bash
        run: |
          if [ "$(git cat-file -t "$GITHUB_REF_NAME")" = "tag" ]; then
            subject=$(git tag -l --format='%(contents:subject)' "$GITHUB_REF_NAME")
          fi
          if [ -n "$subject" ]; then
            title="[$GITHUB_REF_NAME] $subject"
          else
            title="$GITHUB_REF_NAME"
          fi
          echo "title=$title" >> "$GITHUB_OUTPUT"

      # We commit directly to master (no PRs), so GitHub's own
      # generate_release_notes feature (PR-based) would come up empty -
      # build the changelog straight from commit messages since the
      # previous tag instead. Commits are grouped by the leading word of
      # their subject (our own loose convention, e.g. "added ...",
      # "fixed ..."), Keep-a-Changelog style - anything that doesn't match
      # a known keyword falls into "Other".
      - name: Build changelog from commits since last tag
        id: changelog
        shell: bash
        run: |
          previous_tag=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || echo "")
          range="${previous_tag:+$previous_tag..}$GITHUB_REF_NAME"

          # A commit only touching docs/repo-meta/tooling files (README + its
          # screenshots, CI workflows, issue templates, .gitignore, TS/build
          # config, dev-only scripts) is noise for a changelog, skip it.
          # But only if EVERY changed file matches that, so a commit that
          # mixes in a real code/app change still gets listed.
          is_docs_only_commit() {
            local files
            files=$(git diff-tree --no-commit-id --name-only -r "$1")
            [ -n "$files" ] && ! grep -qvE '^(README\.md|media/|\.github/|\.gitignore$|tsconfig(\.\w+)?\.json$|electron\.vite\.config\.ts$|scripts/)' <<< "$files"
          }

          added=() changed=() fixed=() removed=() other=()

          while IFS=$'\t' read -r hash subject || [ -n "$hash" ]; do
            is_docs_only_commit "$hash" && continue

            # Some commit messages here already start with "- ", strip it
            # before inspecting the leading word.
            entry="${subject#- }"
            keyword=$(echo "$entry" | cut -d' ' -f1 | tr '[:upper:]' '[:lower:]')
            case "$keyword" in
              added) added+=("$entry") ;;
              adjusted|changed|replaced|remade|updated) changed+=("$entry") ;;
              fixed) fixed+=("$entry") ;;
              removed) removed+=("$entry") ;;
              *) other+=("$entry") ;;
            esac
          done < <(git log "$range" --reverse --no-merges --pretty=format:'%H%x09%s')

          print_section() {
            local title="$1"
            shift
            if [ "$#" -gt 0 ]; then
              echo "### $title"
              for entry in "$@"; do
                printf -- '- %s\n' "$entry"
              done
              echo
            fi
          }

          delimiter="CHANGELOG_${{ github.run_id }}"
          {
            echo "changelog<<$delimiter"
            print_section "Added" "${added[@]}"
            print_section "Changed" "${changed[@]}"
            print_section "Fixed" "${fixed[@]}"
            print_section "Removed" "${removed[@]}"
            print_section "Other" "${other[@]}"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Keeps the installer filename/app version in sync with the tag.
      # Working-tree only, not committed back.
      - name: Sync package.json version with tag
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Build Windows installer
        run: npm run build:win

      - name: Create GitHub pre-release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.tag.outputs.title }}
          body: ${{ steps.changelog.outputs.changelog }}
          files: dist/*.exe
          prerelease: true
